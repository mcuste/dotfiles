dotfiles_profile: personal
dotfiles_personal: "{{ dotfiles_profile == 'personal' }}"
dotfiles_home: "{{ ansible_facts['user_dir'] }}"
dotfiles_image_build: false
dotfiles_install_software: true
dotfiles_interactive: false
dotfiles_dotnet_enabled: false
dotfiles_checkout: "{{ (playbook_dir + '/../..') | realpath if ansible_connection | default('ssh') == 'local' else dotfiles_home + '/dotfiles' }}"
homebrew_bin: "{{ '/opt/homebrew/bin/brew' if ansible_facts['system'] == 'Darwin' and ansible_facts['architecture'] == 'arm64' else '/usr/local/bin/brew' if ansible_facts['system'] == 'Darwin' else '/home/linuxbrew/.linuxbrew/bin/brew' }}"
dotfiles_brew_path: "{{ homebrew_bin | dirname }}"
dotfiles_path: "{{ dotfiles_brew_path }}:{{ dotfiles_home }}/.cargo/bin:{{ dotfiles_home }}/.local/bin:{{ dotfiles_home }}/.go/bin:{{ dotfiles_home }}/Library/pnpm:{{ dotfiles_home }}/Library/pnpm/bin:{{ dotfiles_home }}/.local/share/pnpm:{{ dotfiles_home }}/.local/share/pnpm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
