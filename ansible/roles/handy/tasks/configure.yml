- name: Deploy handy configuration
  ansible.builtin.include_role:
    name: managed_files
  vars:
    managed_files_owner: handy
    managed_files_state: "{{ handy_state }}"
    managed_files_entries:
      - path: ".config/handy/settings.json"
        mode: "0644"
      - path: ".local/bin/sync-handy-settings"
        mode: "0755"
