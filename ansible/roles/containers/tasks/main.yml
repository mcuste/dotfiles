---
- name: Validate containers state
  ansible.builtin.assert:
    that: containers_state in ['present', 'absent']

- name: Manage container software
  when: dotfiles_install_software | bool
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_INSTALL_UPGRADE: "1"
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  block:
    - name: Manage container packages
      community.general.homebrew:
        name: "{{ containers_packages }}"
        state: "{{ containers_state }}"
        path: "{{ dotfiles_brew_path }}"
        update_homebrew: false

    - name: Manage macOS container applications
      community.general.homebrew_cask:
        name: "{{ containers_macos_casks }}"
        state: "{{ containers_state }}"
        path: "{{ dotfiles_brew_path }}"
        update_homebrew: false
      when:
        - ansible_facts['system'] == 'Darwin'
        - containers_macos_casks | length > 0

- name: Configure containers
  ansible.builtin.import_tasks: configure.yml
