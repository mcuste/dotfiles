- name: Deploy neovim configuration
  ansible.builtin.include_role:
    name: managed_files
  vars:
    managed_files_owner: neovim
    managed_files_state: "{{ neovim_state }}"
    managed_files_entries:
      - path: ".config/nvim/after/ftplugin/markdown.lua"
        mode: "0644"
      - path: ".config/nvim/after/lsp/lua_ls.lua"
        mode: "0644"
      - path: ".config/nvim/bin/rg"
        mode: "0755"
      - path: ".config/nvim/init.lua"
        mode: "0644"
      - path: ".config/nvim/neovim.yml"
        mode: "0644"
      - path: ".config/nvim/nvim-pack-lock.json"
        mode: "0644"
      - path: ".config/nvim/plugin/10_options.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/11_autoread.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/20_keymaps.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/30_mini.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/31_treesitter.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/32_lsp.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/33_formatting.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/34_lint.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/41_neo_tree.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/42_project_tools.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/44_markdown_preview.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/45_herdr_splits.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/46_git_blame.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/47_gitlinker.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/48_herdr_context.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/49_lazygit.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/50_yazi.lua"
        mode: "0644"
      - path: ".config/nvim/plugin/51_gitsigns.lua"
        mode: "0644"
      - path: ".config/nvim/selene.toml"
        mode: "0644"
      - path: ".config/nvim/stylua.toml"
        mode: "0644"
