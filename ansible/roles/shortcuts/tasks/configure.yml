- name: Deploy shortcuts configuration
  ansible.builtin.include_role:
    name: managed_files
  vars:
    managed_files_owner: shortcuts
    managed_files_state: "{{ shortcuts_state }}"
    managed_files_entries:
      - path: ".config/shortcuts/Brave Shortcut.shortcut"
        mode: "0644"
      - path: ".config/shortcuts/Ghostty Shortcut.shortcut"
        mode: "0644"
      - path: ".config/shortcuts/OrbStack Shortcut.shortcut"
        mode: "0644"
      - path: ".config/shortcuts/bindings.json"
        mode: "0644"
      - path: ".config/shortcuts/menu-bindings.json"
        mode: "0644"
      - path: ".local/bin/sync-shortcuts"
        mode: "0755"
