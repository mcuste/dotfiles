---
- name: Validate interactive shortcuts synchronization
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Darwin'
      - shortcuts_state == 'present'
      - dotfiles_interactive | bool
      - not dotfiles_image_build | bool
    fail_msg: "Run the shortcuts synchronization recipe on a configured macOS desktop."

- name: Inspect shortcuts synchronization helper
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.local/bin/sync-shortcuts"
  register: shortcuts_sync_helper

- name: Require installed shortcuts synchronization helper
  ansible.builtin.assert:
    that:
      - shortcuts_sync_helper.stat.exists
      - shortcuts_sync_helper.stat.executable
    fail_msg: "Configure shortcuts before running its synchronization recipe."
