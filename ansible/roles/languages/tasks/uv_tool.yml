---
- name: Find existing uv tool command
  ansible.builtin.shell: "command -v {{ languages_uv_tool.command | quote }}"
  register: languages_uv_command
  changed_when: false
  failed_when: false
  check_mode: false
  when: languages_state == 'present'

- name: Install missing uv tool
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_brew_path }}/uv"
      - tool
      - install
      - --force
      - "{{ languages_uv_tool.name }}"
  when:
    - languages_state == 'present'
    - languages_uv_command.rc != 0

- name: Remove owned uv tool
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_brew_path }}/uv"
      - tool
      - uninstall
      - "{{ languages_uv_tool.name }}"
  when:
    - languages_state == 'absent'
    - languages_uv_list.stdout is search('(?m)^' ~ languages_uv_tool.name ~ ' v')
