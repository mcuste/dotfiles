---
- name: Inspect uv executable
  ansible.builtin.stat:
    path: "{{ dotfiles_brew_path }}/uv"
  register: languages_uv_executable

- name: Manage uv tools
  when: languages_uv_executable.stat.exists
  block:
    - name: Read installed uv tools
      ansible.builtin.command:
        argv:
          - "{{ dotfiles_brew_path }}/uv"
          - tool
          - list
      register: languages_uv_list
      changed_when: false
      check_mode: false

    - name: Manage owned uv tools
      ansible.builtin.include_tasks: uv_tool.yml
      loop: "{{ languages_uv_tools + (languages_personal_uv_tools if languages_state == 'absent' or (dotfiles_personal | bool and 'desktop' in group_names) else []) }}"
      loop_control:
        loop_var: languages_uv_tool
        label: "{{ languages_uv_tool.name }}"
