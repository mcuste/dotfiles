---
- name: Prepare third-party language packages
  vars:
    tapped_formulae: "{{ languages_packages | select('match', '^[^/]+/[^/]+/[^/]+$') | list }}"
    tapped_casks: "{{ languages_casks | select('match', '^[^/]+/[^/]+/[^/]+$') | list }}"
  when:
    - languages_state == 'present'
    - (tapped_formulae + tapped_casks) | length > 0
  block:
    - name: Add taps for the selected packages
      community.general.homebrew_tap:
        name: "{{ item }}"
        state: present
        path: "{{ dotfiles_brew_path }}"
      loop: "{{ (tapped_formulae + tapped_casks) | map('dirname') | unique | list }}"

    - name: Read explicitly trusted Homebrew packages
      ansible.builtin.command:
        argv: ["{{ dotfiles_brew_path }}/brew", trust, "--json=v1"]
      register: languages_brew_trust
      changed_when: false
      check_mode: false

    - name: Trust selected formulae and casks
      vars:
        trust: "{{ languages_brew_trust.stdout | from_json }}"
        formula: "{{ item in tapped_formulae }}"
      ansible.builtin.command:
        argv:
          - "{{ dotfiles_brew_path }}/brew"
          - trust
          - "{{ '--formula' if formula else '--cask' }}"
          - "{{ item }}"
      loop: "{{ tapped_formulae + tapped_casks }}"
      when:
        - (item | dirname) not in trust.taps
        - item not in (trust.formulae if formula else trust.casks)
      changed_when: true

- name: Manage language packages
  community.general.homebrew:
    name: "{{ languages_packages }}"
    state: "{{ languages_state }}"
    path: "{{ dotfiles_brew_path }}"
    update_homebrew: false

- name: Manage Terraform linter
  community.general.homebrew_cask:
    name: "{{ languages_casks }}"
    state: "{{ languages_state }}"
    path: "{{ dotfiles_brew_path }}"
    update_homebrew: false
