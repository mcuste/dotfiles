---
- name: Validate Kanata state
  ansible.builtin.assert:
    that: kanata_state in ['present', 'absent']

- name: Remove iKanata before removing the managed keymap
  community.general.homebrew_cask:
    name: mcuste/tap/ikanata
    state: absent
    path: "{{ dotfiles_brew_path }}"
  when:
    - kanata_state == 'absent'
    - dotfiles_install_software | bool

- name: Manage the Kanata keymap
  ansible.builtin.include_role:
    name: managed_files
  vars:
    managed_files_owner: kanata
    managed_files_state: "{{ kanata_state }}"
    managed_files_entries:
      - path: .config/kanata/config.kbd

# iKanata can create a starter keymap when its installer opens onboarding.
- name: Install iKanata after linking the keymap
  when:
    - kanata_state == 'present'
    - dotfiles_install_software | bool
  block:
    - name: Prepare the iKanata tap
      ansible.builtin.include_role:
        name: homebrew_taps
      vars:
        homebrew_formulae: []
        homebrew_casks: [mcuste/tap/ikanata]

    # The iKanata pkg installer needs sudo, but Ansible gives Homebrew no TTY.
    # Homebrew runs `sudo -A` when SUDO_ASKPASS is set, so ask in a dialog.
    - name: Create a temporary sudo password prompt
      ansible.builtin.tempfile:
        suffix: .askpass
      register: kanata_askpass

    - name: Install iKanata with a sudo password dialog
      block:
        - name: Write the sudo password prompt
          ansible.builtin.copy:
            dest: "{{ kanata_askpass.path }}"
            mode: "0700"
            content: |
              #!/bin/sh
              exec /usr/bin/osascript \
                -e 'text returned of (display dialog "Homebrew needs your password to install iKanata." with title "iKanata" default answer "" with hidden answer with icon caution)'

        - name: Install or upgrade the iKanata cask
          community.general.homebrew_cask:
            name: mcuste/tap/ikanata
            state: latest
            path: "{{ dotfiles_brew_path }}"
          environment:
            SUDO_ASKPASS: "{{ kanata_askpass.path }}"
      always:
        - name: Remove the sudo password prompt
          ansible.builtin.file:
            path: "{{ kanata_askpass.path }}"
            state: absent
