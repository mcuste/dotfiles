- name: Deploy shell configuration
  ansible.builtin.include_role:
    name: managed_files
  vars:
    managed_files_owner: shell
    managed_files_state: "{{ shell_state }}"
    managed_files_entries:
      - path: ".bash_profile"
        mode: "0644"
      - path: ".bashrc"
        mode: "0644"
      - path: ".config/fish/config.fish"
        mode: "0644"
      - path: ".config/fish/themes/CatppuccinMocha.theme"
        mode: "0644"
      - path: ".config/starship.toml"
        mode: "0644"
      - path: ".zshrc"
        mode: "0644"
      - path: ".config/shell/common.sh"
        mode: "0644"
        template: true
      - path: ".config/shell/common.fish"
        mode: "0644"
        template: true
