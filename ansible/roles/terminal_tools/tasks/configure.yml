- name: Deploy terminal tools configuration
  ansible.builtin.include_role:
    name: managed_files
  vars:
    managed_files_owner: terminal_tools
    managed_files_state: "{{ terminal_tools_state }}"
    managed_files_entries:
      - path: ".config/yazi/Catppuccin-mocha.tmTheme"
        mode: "0644"
      - path: ".config/yazi/theme.toml"
        mode: "0644"
      - path: ".config/yazi/theme.toml-1750172534624449"
        mode: "0644"
