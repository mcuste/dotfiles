---
- name: Prepare desktop package taps
  ansible.builtin.import_role:
    name: homebrew_taps
  vars:
    homebrew_formulae: "{{ desktop_apps_formulae }}"
    homebrew_casks: "{{ desktop_apps_casks }}"
  when: ansible_facts['system'] == 'Darwin'

- name: Install desktop formulae
  community.general.homebrew:
    name: "{{ desktop_apps_formulae }}"
    state: present
    path: "{{ dotfiles_brew_path }}"
    update_homebrew: false
  when: ansible_facts['system'] == 'Darwin'

- name: Install desktop casks
  community.general.homebrew_cask:
    name: "{{ desktop_apps_casks }}"
    state: present
    path: "{{ dotfiles_brew_path }}"
    update_homebrew: false
    install_options: "appdir={{ dotfiles_home }}/Applications"
  when: ansible_facts['system'] == 'Darwin'
