- name: Deploy cloud tools configuration
  ansible.builtin.include_role:
    name: managed_files
  vars:
    managed_files_owner: cloud_tools
    managed_files_state: "{{ cloud_tools_state }}"
    managed_files_entries:
      - path: ".local/bin/gcloud-cluster-setup"
        mode: "0755"
      - path: ".local/bin/gcloud-list-user-permissions"
        mode: "0755"
