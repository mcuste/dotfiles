- name: Deploy herdr configuration
  ansible.builtin.include_role:
    name: managed_files
  vars:
    managed_files_owner: herdr
    managed_files_state: "{{ herdr_state }}"
    managed_files_entries:
      - path: ".config/herdr/.plugins.lock"
        mode: "0644"
      - path: ".config/herdr/config.toml"
        mode: "0644"
      - path: ".config/herdr/plugins/config/herdr-splits/herdr-splits.conf"
        mode: "0644"
